name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Helm lint
        run: helm lint .

      - name: Helm template
        run: helm template collector . -n arnica-collector > /dev/null

      - name: Shellcheck
        run: shellcheck scripts/*.sh test/*.sh

      # release.yaml publishes whatever version is in Chart.yaml once it has no
      # tag yet, so a chart change without a version bump would never ship.
      - name: Require version bump for chart changes
        if: github.event_name == 'pull_request'
        run: |
          VERSION=$(awk '/^version:/ {print $2}' Chart.yaml)
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null \
            && ! git diff --quiet "v${VERSION}" HEAD -- Chart.yaml values.yaml templates scripts; then
            echo "::error file=Chart.yaml::Chart changed but version ${VERSION} is already released. Bump 'version' in Chart.yaml."
            exit 1
          fi

  kind-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-template
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: chart-ci

      - name: Install chart and verify connection line
        run: test/smoke.sh
